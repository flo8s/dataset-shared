[project]
name = "queria-dataset"
version = "0.1.0"
description = "Queria データセット宣言 (dataset.yml / *.table.yml) の検証と dataset.json のビルド"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4", "duckdb>=1.1"]

[project.scripts]
queria-dataset = "queria_dataset.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["queria_dataset"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
