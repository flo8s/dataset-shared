name: Checkpoint (reusable)

on:
  workflow_call:
    inputs:
      s3_bucket:
        # fdl のリポだけが使う。queria に移ったリポでは何も指さないので、
        # 最後のリポが移り終わったら入力ごと外す
        required: false
        type: string

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    env:
      # queria は誰のデータセットに書くのかをトークンから決める。R2 の鍵は渡さない
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      # 以下 4 つは移行前のリポのみ。最後のリポが移り終わったら外す
      FDL_S3_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      FDL_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      FDL_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      FDL_S3_BUCKET: ${{ inputs.s3_bucket }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      # fdl.toml の有無が「このリポはまだ fdl か」の判定。移行済みのリポには無い
      - name: Install dependencies
        run: |
          if [ -f fdl.toml ]; then
            uv lock --upgrade-package frozen-ducklake
          else
            uv lock --upgrade-package queria
          fi
          uv sync

      # スナップショットの expire と、それが押さえていたデータファイルの削除。
      # 他に消せるものは無い: DuckLake は live なスナップショットが名前を持つ
      # ファイルを全部保持するので、ビルドして公開するだけのデータセットが際限なく増える。
      #
      # 手動の CHECKPOINT は使わない。inlined data を parquet に flush して
      # メモリを食い尽くし、肥大カタログで OOM クラッシュする (dataset-e-stat で発生)。
      #
      # 公開しないと expire の結果が読み手に見えないので push まで行う。push は
      # 既定で expire も行うため、明示的に expire したあとは --keep-history で二度回さない
      - name: Expire snapshots and publish
        run: |
          if [ -f fdl.toml ]; then
            uv run fdl pull default
            uv run fdl expire default --retention-days 7
            uv run fdl push default
          else
            uv run queria pull
            uv run queria expire --retention-days 7
            uv run queria push --keep-history
          fi
